name: myapp
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  device_preview: ^1.3.1
  material_symbols_icons: ^4.2906.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - images/meet_baseline_nv700_20dp.png
  #   - images/a_dot_ham.jpeg

  fonts:
    - family:  CustomIcons
      fonts:
        - asset: fonts/CustomIcons.ttf

    - family: Google Sans
      fonts:
        - asset: fonts/GoogleSans-Regular.ttf
        - asset: fonts/GoogleSans-Italic.ttf
          style: italic
        - asset: fonts/GoogleSans-Bold.ttf
          weight: 600
